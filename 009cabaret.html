<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Pose Timer — Showgirl Cabaret — Wyrd Life Drawing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0f0d0b;
            color: #ece0cc;
            font-family: 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        /* START SCREEN */
        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(ellipse at center, #241c14 0%, #0f0d0b 70%);
            padding: 24px;
            text-align: center;
        }

        .start-screen h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            color: #c8a55c;
            letter-spacing: 4px;
            margin-bottom: 8px;
            text-shadow: 0 0 40px rgba(200, 165, 92, 0.4);
        }

        .start-screen .event-name {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #b08858;
            margin-bottom: 48px;
            font-style: italic;
        }

        .start-screen .pose-count {
            font-size: 1rem;
            color: #806040;
            margin-bottom: 32px;
        }

        .start-btn {
            background: #c8a55c;
            color: #0f0d0b;
            border: none;
            padding: 20px 64px;
            font-size: 1.4rem;
            font-family: 'Georgia', serif;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            box-shadow: 0 0 40px rgba(200, 165, 92, 0.3);
        }

        .start-btn:hover, .start-btn:active {
            background: #e6cf95;
            box-shadow: 0 0 60px rgba(200, 165, 92, 0.5);
        }

        /* TIMER SCREEN */
        .timer-screen {
            display: none;
            position: relative;
            height: 100vh;
            width: 100vw;
        }

        .pose-image-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080706;
        }

        .pose-image {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }

        .pose-image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #5a4030;
            font-size: 1.2rem;
            gap: 12px;
            padding: 24px;
            text-align: center;
        }

        .pose-image-placeholder .pose-number {
            font-size: clamp(3rem, 8vw, 5rem);
            color: #c8a55c;
            font-weight: bold;
            font-family: 'Georgia', serif;
            letter-spacing: 4px;
        }

        .pose-image-placeholder .pose-detail {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: #b08858;
            font-style: italic;
            max-width: 600px;
        }

        /* TIMER OVERLAY */
        .timer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 24px;
            background: linear-gradient(to bottom, rgba(8, 7, 6, 0.85) 0%, rgba(8, 7, 6, 0) 100%);
            z-index: 10;
            pointer-events: none;
        }

        .timer-display {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: bold;
            color: #c8a55c;
            text-shadow: 0 0 30px rgba(200, 165, 92, 0.5), 0 2px 8px rgba(0,0,0,0.8);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .timer-display.warning {
            color: #ff5530;
            text-shadow: 0 0 30px rgba(255, 85, 48, 0.6);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .pose-info {
            text-align: right;
            line-height: 1.3;
        }

        .pose-info .pose-label {
            font-size: clamp(1rem, 3vw, 1.6rem);
            color: #b08858;
        }

        .pose-info .pose-duration {
            font-size: clamp(0.8rem, 2vw, 1.1rem);
            color: #806040;
        }

        /* PROGRESS BAR */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: rgba(200, 165, 92, 0.15);
            z-index: 10;
        }

        .progress-fill {
            height: 100%;
            background: #c8a55c;
            transition: width 1s linear;
        }

        .progress-fill.warning {
            background: #ff5530;
        }

        /* CONTROLS */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            z-index: 30;
            opacity: 1;
            pointer-events: all;
        }

        .ctrl-btn {
            background: rgba(200, 165, 92, 0.25);
            border: 1px solid rgba(200, 165, 92, 0.5);
            color: #c8a55c;
            padding: 12px 24px;
            font-size: 1rem;
            font-family: 'Georgia', serif;
            cursor: pointer;
            border-radius: 4px;
            backdrop-filter: blur(8px);
        }

        .ctrl-btn:hover, .ctrl-btn:active {
            background: rgba(200, 165, 92, 0.45);
        }

        /* TRANSITION */
        .transition-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(8, 7, 6, 0.95);
            z-index: 20;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .transition-overlay.active {
            display: flex;
        }

        .transition-text {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #c8a55c;
            text-align: center;
        }

        .transition-next {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: #b08858;
            font-style: italic;
            text-align: center;
            padding: 0 24px;
            max-width: 720px;
        }

        /* END SCREEN */
        .end-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(ellipse at center, #241c14 0%, #0f0d0b 70%);
            text-align: center;
            padding: 24px;
        }

        .end-screen h2 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: #c8a55c;
            margin-bottom: 16px;
        }

        .end-screen p {
            font-size: 1.2rem;
            color: #b08858;
            margin-bottom: 40px;
        }

        /* BREAK SCREEN */
        .break-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, #241c14 0%, #0f0d0b 70%);
            z-index: 20;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 24px;
        }

        .break-overlay.active {
            display: flex;
        }

        .break-overlay h2 {
            font-size: clamp(2rem, 5vw, 3rem);
            color: #c8a55c;
        }

        .break-overlay .break-timer {
            font-size: clamp(3rem, 10vw, 6rem);
            color: #b08858;
            font-variant-numeric: tabular-nums;
        }

        .break-overlay .break-note {
            color: #806040;
            font-style: italic;
            font-size: 1rem;
            max-width: 480px;
            text-align: center;
            padding: 0 24px;
        }

    </style>
</head>
<body>
    <!-- START SCREEN -->
    <div class="start-screen" id="startScreen">
        <h1>WYRD LIFE DRAWING</h1>
        <div class="event-name" id="eventName">Showgirl Cabaret</div>
        <div class="pose-count" id="poseCount"></div>
        <button class="start-btn" id="startBtn">START</button>
    </div>

    <!-- TIMER SCREEN -->
    <div class="timer-screen" id="timerScreen">
        <div class="pose-image-container" id="poseContainer"></div>

        <div class="timer-overlay">
            <div class="timer-display" id="timerDisplay">00:00</div>
            <div class="pose-info">
                <div class="pose-label" id="poseLabel"></div>
                <div class="pose-duration" id="poseDuration"></div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="controls" id="controls">
            <button class="ctrl-btn" id="prevBtn">PREV</button>
            <button class="ctrl-btn" id="pauseBtn">PAUSE</button>
            <button class="ctrl-btn" id="nextBtn">NEXT</button>
        </div>

        <div class="transition-overlay" id="transitionOverlay">
            <div class="transition-text" id="transitionText"></div>
            <div class="transition-next" id="transitionNext"></div>
        </div>

        <div class="break-overlay" id="breakOverlay">
            <h2 id="breakLabel">BREAK</h2>
            <div class="break-timer" id="breakTimer">00:00</div>
            <div class="break-note" id="breakNote">Stretch. Sip. Mingle.</div>
        </div>
    </div>

    <!-- END SCREEN -->
    <div class="end-screen" id="endScreen">
        <h2>Thank you!</h2>
        <p>Wyrd Life Drawing &middot; Showgirl Cabaret</p>
        <button class="start-btn" onclick="location.reload()">RESTART</button>
    </div>

    <script>
    // ============================================================
    //  POSE CONFIGURATION
    //  11 poses + 1 break, from Sam and Esmee's Showgirl Cabaret pose chart.
    //  Warm-up 5 min poses, building to a 20 and a 30 minute pose.
    //  Total drawing portion: 2h 30min (2h 15 posing + 15 min break).
    // ============================================================
    const EVENT_NAME = "Showgirl Cabaret";

    const POSES = [
        { duration: 300, label: "Pose 1 — Showgirl (5:00)",
          detail: "Standing tall, arms thrown up and out. Big smile, feathers everywhere.",
          image: "images/009cabaret/Pose1.jpg" },
        { duration: 300, label: "Pose 2 — The wink (5:00)",
          detail: "Standing, turned three quarters. One hand flicking the skirt, laughing over the shoulder.",
          image: "images/009cabaret/Pose2.jpg" },
        { duration: 300, label: "Pose 3 — Vaudeville (5:00)",
          detail: "Bent forward at the hips, back arched. Both hands up at the hat.",
          image: "images/009cabaret/Pose3.jpg" },
        { duration: 300, label: "Pose 4 — Rehearsal (5:00)",
          detail: "Seated on the floor, legs to one side. Leaning back on both hands, head tilted.",
          image: "images/009cabaret/Pose4.jpg" },
        { duration: 600, label: "Pose 5 — Backstage (10:00)",
          detail: "Seated, one leg kicked up high. Leaning back, at ease among the costumes.",
          image: "images/009cabaret/Pose5.jpg" },
        { duration: 600, label: "Pose 6 — The dancer (10:00)",
          detail: "Perched on a ledge, knees apart and feet pointed. Hands resting on the edge.",
          image: "images/009cabaret/Pose6.jpg" },
        { duration: 900, label: "Pose 7 — The cigarette holder (15:00)",
          detail: "Seated in profile, one leg crossed high. Arm raised with the long holder.",
          image: "images/009cabaret/Pose7.jpg" },
        { duration: 900, label: "Pose 8 — The red dress (15:00)",
          detail: "Seated sideways on the chair, turned back to the room. Arm draped over the backrest.",
          image: "images/009cabaret/Pose8.jpg" },
        { duration: 900, label: "Pose 9 — The fan (15:00)",
          detail: "Seated, leaning forward. The fan held up across the chest, eyes over it.",
          image: "images/009cabaret/Pose9.jpg" },
        { break: true, duration: 900, label: "Break (15:00)",
          note: "Stretch, drinks, mingle. Two long poses to finish." },
        { duration: 1200, label: "Pose 10 — Luxurious mood (20:00)",
          detail: "Reclining on the divan, one arm thrown up behind the head. Gown pooling over the edge.",
          image: "images/009cabaret/Pose10.jpg" },
        { duration: 1800, label: "Pose 11 — The swoon (30:00)",
          detail: "Lying back across the ottoman, head dropped, arms open. Long hold, fully relaxed.",
          image: "images/009cabaret/Pose11.jpg" },
    ];

    const WARNING_SECONDS = 30;
    const TRANSITION_MS = 3000;

    // ============================================================
    //  AUDIO
    // ============================================================
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playChime() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        [523.25, 659.25].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.3, now + i * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 1.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.15);
            osc.stop(now + i * 0.15 + 1.5);
        });
    }

    function playEndChime() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        [783.99, 659.25, 523.25].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.35, now + i * 0.2);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.2 + 1.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.2);
            osc.stop(now + i * 0.2 + 2);
        });
    }

    // ============================================================
    //  TIMER ENGINE
    // ============================================================
    let currentPoseIndex = 0;
    let timeRemaining = 0;
    let totalTime = 0;
    let timerInterval = null;
    let isPaused = false;

    const $ = id => document.getElementById(id);

    const poseOnlyCount = POSES.filter(p => !p.break).length;
    $('eventName').textContent = EVENT_NAME;
    $('poseCount').textContent = poseOnlyCount + ' poses + 1 break';

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function showPose(index) {
        const pose = POSES[index];
        if (!pose) {
            endSession();
            return;
        }

        currentPoseIndex = index;
        timeRemaining = pose.duration;
        totalTime = pose.duration;
        isPaused = false;
        $('pauseBtn').textContent = 'PAUSE';

        $('transitionOverlay').classList.remove('active');
        $('breakOverlay').classList.remove('active');

        if (pose.break) {
            $('breakOverlay').classList.add('active');
            const breakName = (pose.label.split(' (')[0] || 'BREAK').toUpperCase();
            $('breakLabel').textContent = breakName;
            $('breakNote').textContent = pose.note || 'Stretch. Sip. Mingle.';
            $('breakTimer').textContent = formatTime(timeRemaining);
            $('timerDisplay').textContent = formatTime(timeRemaining);
            $('poseLabel').textContent = pose.label;
            $('poseDuration').textContent = formatTime(pose.duration) + ' total';
        } else {
            const container = $('poseContainer');
            if (pose.image) {
                // If the reference image is not in place yet, fall back to the
                // text placeholder instead of showing a broken-image icon.
                const ph = '<div class="pose-image-placeholder">' +
                    '<div class="pose-number">' + (pose.label.split(' — ')[0] || pose.label) + '</div>' +
                    '<div class="pose-detail">' + (pose.detail || '') + '</div>' +
                    '</div>';
                const img = new Image();
                img.className = 'pose-image';
                img.alt = pose.label || '';
                img.onload = () => { container.innerHTML = ''; container.appendChild(img); };
                img.onerror = () => { container.innerHTML = ph; };
                container.innerHTML = ph;
                img.src = pose.image;
            } else {
                // Fallback placeholder if no image is set
                container.innerHTML = '<div class="pose-image-placeholder">' +
                    '<div class="pose-number">' + (pose.label.split(' — ')[0] || pose.label) + '</div>' +
                    '<div class="pose-detail">' + (pose.detail || '') + '</div>' +
                    '</div>';
            }

            $('timerDisplay').textContent = formatTime(timeRemaining);
            $('poseLabel').textContent = pose.label;
            $('poseDuration').textContent = formatTime(pose.duration) + ' total';
        }

        updateProgress();
        startTimer();
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            if (isPaused) return;

            timeRemaining--;

            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                playEndChime();
                transitionToNext();
                return;
            }

            $('timerDisplay').textContent = formatTime(timeRemaining);

            const isWarning = timeRemaining <= WARNING_SECONDS;
            $('timerDisplay').classList.toggle('warning', isWarning);
            $('progressFill').classList.toggle('warning', isWarning);

            if (POSES[currentPoseIndex].break) {
                $('breakTimer').textContent = formatTime(timeRemaining);
            }

            updateProgress();
        }, 1000);
    }

    function updateProgress() {
        const pct = ((totalTime - timeRemaining) / totalTime) * 100;
        $('progressFill').style.width = pct + '%';
    }

    function transitionToNext() {
        const nextIndex = currentPoseIndex + 1;
        const nextPose = POSES[nextIndex];

        if (!nextPose) {
            endSession();
            return;
        }

        $('transitionOverlay').classList.add('active');
        $('transitionText').textContent = nextPose.break ? 'Break time' : 'Next pose';
        $('transitionNext').textContent = nextPose.label;

        setTimeout(() => {
            playChime();
            showPose(nextIndex);
        }, TRANSITION_MS);
    }

    function endSession() {
        clearInterval(timerInterval);
        $('timerScreen').style.display = 'none';
        $('endScreen').style.display = 'flex';
    }

    // ============================================================
    //  CONTROLS
    // ============================================================
    $('startBtn').addEventListener('click', () => {
        initAudio();
        playChime();
        $('startScreen').style.display = 'none';
        $('timerScreen').style.display = 'block';
        showPose(0);
    });

    $('pauseBtn').addEventListener('click', () => {
        isPaused = !isPaused;
        $('pauseBtn').textContent = isPaused ? 'RESUME' : 'PAUSE';
    });

    $('nextBtn').addEventListener('click', () => {
        clearInterval(timerInterval);
        $('timerDisplay').classList.remove('warning');
        $('progressFill').classList.remove('warning');
        playChime();
        showPose(currentPoseIndex + 1);
    });

    $('prevBtn').addEventListener('click', () => {
        if (currentPoseIndex > 0) {
            clearInterval(timerInterval);
            $('timerDisplay').classList.remove('warning');
            $('progressFill').classList.remove('warning');
            playChime();
            showPose(currentPoseIndex - 1);
        }
    });
    </script>
</body>
</html>
